# Perf benches are driven by pytest but are not named like tests: the files are
# bench_*.py so a bare `pytest` at the repo root collects the suite in ~50s
# instead of dragging in the 1K/5K-shard scale benches (~25 min).
#
# Pytest picks the nearest pytest.ini to the paths on the command line, so this
# file applies only when you aim pytest at this directory
# (`pytest benchmarks/`, `pytest benchmarks/bench_store_ops.py`) and leaves the
# root pyproject.toml config in charge everywhere else.
[pytest]
python_files = bench_*.py
markers =
    ipfs: needs a local Kubo node on 127.0.0.1:5001
