[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spiritwriter"
version = "0.10.1"
description = "Agent memory you own — content-addressed memory shards, provable traces, scoped delegation, and entity resolution, local-first"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Aaron Markham"},
    {name = "Lilit (AI)"},
]
keywords = ["agent-memory", "content-addressed", "knowledge-base", "llm", "shards", "provenance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    # CI tests 3.12 only; requires-python (>=3.9) is the install-surface
    # guarantee. Classifiers list the generic 3 + the tested version rather
    # than advertise specific versions no CI matrix backs (see .github/workflows/ci.yml).
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anthropic>=0.40.0",
    "cryptography>=41.0.0",
    "keyring>=25.0.0",
    "pymupdf>=1.24.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/aaronmarkham/spiritwriter-core"
Repository = "https://github.com/aaronmarkham/spiritwriter-core"
Changelog = "https://github.com/aaronmarkham/spiritwriter-core/blob/main/CHANGELOG.md"
Issues = "https://github.com/aaronmarkham/spiritwriter-core/issues"

[project.scripts]
spiritwriter = "spiritwriter.secrets.cli:main"

[project.optional-dependencies]
sealed = ["PyNaCl>=1.5.0"]
network = ["requests>=2.28"]
strands = ["strands-agents>=0.1.0"]
mempalace = ["mempalace>=3.0.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["spiritwriter*"]

[tool.setuptools.package-data]
"spiritwriter.audit" = ["data/*.json"]
"spiritwriter.sw_vocab" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "asyncio: async test driven by pytest-asyncio (in the `dev` extra)",
    "ipfs: needs a local Kubo node on 127.0.0.1:5001",
]
